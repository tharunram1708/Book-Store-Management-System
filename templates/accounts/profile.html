{% extends 'base.html' %}
{% block title %}My profile · PageTurner{% endblock %}
{% block content %}<div class="form-panel mx-auto"><p class="eyebrow">ACCOUNT</p><h1 class="h2 mb-4">My profile</h1><form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save changes</button></form></div>{% endblock %}
