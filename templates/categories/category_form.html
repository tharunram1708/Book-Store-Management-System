{% extends 'base.html' %}
{% block title %}{{ heading }} · PageTurner{% endblock %}
{% block content %}<div class="form-panel mx-auto"><a class="text-decoration-none" href="{% url 'category_list' %}">← Categories</a><h1 class="h2 mt-3 mb-4">{{ heading }}</h1><form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save category</button></form></div>{% endblock %}
